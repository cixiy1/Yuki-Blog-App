name: yuki_blog_app
description: "Yuki Blog - the mobile app of Yuki-blog, built for Class 2615."
publish_to: 'none'
version: 1.3.0+5

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^18.0.2
  http: ^1.2.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/data/

flutter_launcher_icons:
  image_path: "assets/icons/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  # Android自适应图标（安卓8.0+）
  android_adaptive_icon: true
  android_adaptive_icon_foreground: "assets/icons/app_icon.png"
  android_adaptive_icon_background_color: "#ffffff"
  # Web图标
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#ffffff"
    theme_color: "#2196F3"
  # Windows
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 48
  # macOS
  macos:
    generate: true
    image_path: "assets/icons/app_icon.png"
