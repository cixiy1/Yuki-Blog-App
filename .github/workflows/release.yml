name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Run tests
        run: flutter test

      # 固定签名：从仓库 Secrets 还原密钥库与口令，让每次发的包签名一致。
      # 未配置时回退 debug 签名（每台 runner 的 debug 密钥都不同，用户无法覆盖安装）。
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES_BASE64: ${{ secrets.ANDROID_KEY_PROPERTIES_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning title=未配置固定签名::仓库缺少 ANDROID_KEYSTORE_BASE64，本次将回退 debug 签名，用户无法覆盖安装"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/release.jks
          printf '%s' "$KEY_PROPERTIES_BASE64" | base64 -d > android/key.properties
          echo "已从 Secrets 还原固定签名密钥"

      - name: Build release APK
        run: flutter build apk --release

      # 把签名证书指纹打出来，方便随时核对「这次发的包和上次是不是同一个签名」
      - name: Print APK signer certificate
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256"

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk yuki-blog-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: yuki-blog-*.apk
          generate_release_notes: true
